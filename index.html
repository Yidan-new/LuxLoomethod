<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寄售台账</title>
<style>
:root{
  --kimi-font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --kimi-color-text-primary:#1b1b1f;
  --kimi-color-text-secondary:#56565c;
  --kimi-color-text-tertiary:#8a8a92;
  --kimi-color-text-quaternary:#b4b4bc;
  --kimi-color-border:#e5e5ea;
  --kimi-color-surface:#ffffff;
  --kimi-color-surface-muted:#f4f4f6;
  --kimi-color-surface-raised:#ffffff;
  --kimi-color-warning:#d97706;
  --kimi-color-danger:#dc2626;
  --kimi-color-positive:#16a34a;
  --kimi-chart-1:#4C6FE7;
  --kimi-chart-2:#E8734C;
  --kimi-chart-3:#2FA36B;
  --kimi-chart-4:#7A5AF8;
  --kimi-chart-5:#C9A227;
  --t-fast:150ms;
  --ease-out:cubic-bezier(.2,.8,.4,1);
}
body{margin:0;background:#fafafa}
body>.wrap{max-width:1080px;margin:0 auto;padding:16px;box-sizing:border-box}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<style>
.wrap{font-family:var(--kimi-font-sans);font-size:16px;line-height:24px;color:var(--kimi-color-text-primary)}
.wrap button,.wrap input,.wrap select,.wrap textarea{font:inherit;color:inherit}
.wrap button{cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ttl{font-size:20px;font-weight:500}
.sub{font-size:12px;color:var(--kimi-color-text-tertiary)}
.hd-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lsel{padding:7px 10px;border:1px solid var(--kimi-color-border);border-radius:10px;background:var(--kimi-color-surface);font-size:14px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--kimi-color-border);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 12px;font-size:14px;color:var(--kimi-color-text-secondary);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--kimi-color-text-primary);border-bottom-color:var(--kimi-color-text-primary);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--kimi-color-border);border-radius:12px;padding:12px;background:var(--kimi-color-surface)}
.kpi .v{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12px;color:var(--kimi-color-text-tertiary)}
.kpi.click{cursor:pointer;transition:border-color var(--t-fast) var(--ease-out)}
.kpi.click:hover{border-color:var(--kimi-chart-1)}
.kpi.click .l{color:var(--kimi-chart-1)}
.alertbox{border:1px solid var(--kimi-color-border);border-radius:12px;padding:12px;margin-bottom:16px;background:var(--kimi-color-surface)}
.alertbox h3{font-size:14px;font-weight:500;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.arow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;border-top:1px solid var(--kimi-color-border)}
.arow:first-of-type{border-top:none}
.arow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.c-warn{color:var(--kimi-color-warning);background:color-mix(in srgb,var(--kimi-color-warning) 14%,transparent)}
.c-danger{color:var(--kimi-color-danger);background:color-mix(in srgb,var(--kimi-color-danger) 12%,transparent)}
.c-pos{color:var(--kimi-color-positive);background:color-mix(in srgb,var(--kimi-color-positive) 12%,transparent)}
.c-gray{color:var(--kimi-color-text-secondary);background:var(--kimi-color-surface-muted)}
.c-blue{color:var(--kimi-chart-1);background:color-mix(in srgb,var(--kimi-chart-1) 12%,transparent)}
.c-purple{color:var(--kimi-chart-4);background:color-mix(in srgb,var(--kimi-chart-4) 12%,transparent)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-weight:500;color:var(--kimi-color-text-tertiary);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--kimi-color-border)}
.tb td{padding:8px;border-bottom:1px solid var(--kimi-color-border);vertical-align:middle}
.tb tr:hover .rowact{opacity:1}
.rowact{opacity:0;display:inline-flex;gap:4px;transition:opacity var(--t-fast) var(--ease-out)}
.ibtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface);display:inline-flex;align-items:center;justify-content:center;color:var(--kimi-color-text-secondary)}
.ibtn:hover{color:var(--kimi-color-text-primary)}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;background:var(--kimi-color-surface-muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.pname{font-weight:500}
.pcode{font-size:12px;color:var(--kimi-color-text-tertiary)}
.form{border:1px solid var(--kimi-color-border);border-radius:12px;padding:16px;margin-bottom:16px;background:var(--kimi-color-surface)}
.form h3{font-size:14px;font-weight:500;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld label{display:block;font-size:12px;color:var(--kimi-color-text-tertiary);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--kimi-color-border);border-radius:10px;background:var(--kimi-color-surface);font-size:14px}
.btn{padding:8px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--kimi-chart-1) 45%,transparent);background:color-mix(in srgb,var(--kimi-chart-1) 10%,transparent);color:var(--kimi-chart-1);font-size:14px;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn:hover{background:color-mix(in srgb,var(--kimi-chart-1) 18%,transparent)}
.btn.ghost{background:var(--kimi-color-surface);color:var(--kimi-color-text-primary);border-color:var(--kimi-color-border);font-weight:400}
.btn.ghost:hover{background:var(--kimi-color-surface-muted)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:6px 12px;border-radius:8px;border:1px solid var(--kimi-color-border);font-size:13px;cursor:pointer;color:var(--kimi-color-text-secondary);background:var(--kimi-color-surface)}
.seg input:checked+span{border-color:var(--kimi-color-text-primary);color:var(--kimi-color-text-primary);background:var(--kimi-color-surface-muted);font-weight:500}
.muted{font-size:12px;color:var(--kimi-color-text-quaternary)}
.empty{padding:32px;text-align:center;color:var(--kimi-color-text-tertiary);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scard{border:1px solid var(--kimi-color-border);border-radius:12px;padding:14px;cursor:pointer;background:var(--kimi-color-surface)}
.scard:hover{border-color:var(--kimi-color-text-tertiary)}
.scard .nm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.scard .mt{font-size:12px;color:var(--kimi-color-text-tertiary);margin-top:4px}
.scard.stopped{opacity:.6}
.imgup{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imgprev{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface-muted);display:flex;align-items:center;justify-content:center;color:var(--kimi-color-text-quaternary)}
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.phcard{border:1px solid var(--kimi-color-border);border-radius:10px;padding:6px;position:relative;background:var(--kimi-color-surface)}
.phcard img{width:100%;height:100px;object-fit:cover;border-radius:7px}
.phcard .phm{font-size:11px;color:var(--kimi-color-text-tertiary);margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
h2.sec{font-size:15px;font-weight:500;margin:20px 0 8px}
.note{font-size:12px;color:var(--kimi-color-text-tertiary);background:var(--kimi-color-surface-muted);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.monthnav .mlab{font-size:17px;font-weight:500;min-width:110px;text-align:center}
details{border:1px solid var(--kimi-color-border);border-radius:12px;padding:12px 16px;margin-bottom:12px;background:var(--kimi-color-surface)}
details summary{cursor:pointer;font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:12px}
.picker{position:relative}
.pk-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--kimi-color-surface-raised);border:1px solid var(--kimi-color-border);border-radius:10px;z-index:5;max-height:240px;overflow:auto;box-shadow:0 4px 16px color-mix(in srgb,var(--kimi-color-text-primary) 8%,transparent)}
.pk-item{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:14px;cursor:pointer}
.pk-item:hover{background:var(--kimi-color-surface-muted)}
.rank{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:500;background:var(--kimi-color-surface-muted);color:var(--kimi-color-text-secondary);flex:none}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--kimi-color-border);border-radius:8px;overflow:hidden}
.stepper button{width:28px;height:30px;border:none;background:var(--kimi-color-surface);font-size:15px;color:var(--kimi-color-text-secondary);display:flex;align-items:center;justify-content:center}
.stepper button:hover:not(:disabled){color:var(--kimi-chart-1);background:color-mix(in srgb,var(--kimi-chart-1) 8%,transparent)}
.stepper .qv{width:44px;border:none;text-align:center;font-variant-numeric:tabular-nums;font-weight:500;font-size:14px;padding:6px 0;outline:none;-moz-appearance:textfield}
.stepper .qv::-webkit-outer-spin-button,.stepper .qv::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mapdot{cursor:pointer}
.mapdot:hover circle.halo{stroke:var(--kimi-color-text-primary)}
.maplbl{paint-order:stroke;stroke:var(--kimi-color-surface);stroke-width:3px;stroke-linejoin:round}
.osheet td,.osheet th{padding:6px 8px;font-size:13px;border-bottom:1px solid var(--kimi-color-border)}
.tscroll{overflow-x:auto}
.palchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--kimi-color-border);border-radius:999px;background:var(--kimi-color-surface);font-size:13px;cursor:grab;user-select:none;touch-action:none}
.palchip:active{cursor:grabbing}
.dragghost{position:fixed;z-index:1200;pointer-events:none;padding:6px 12px;border-radius:999px;background:var(--kimi-color-surface-raised);border:1px solid var(--kimi-chart-1);font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
#diy-svg{display:block;width:100%;background:var(--kimi-color-surface);border:1px dashed var(--kimi-color-border);border-radius:12px;touch-action:none}
.mback{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
.mbg{position:absolute;inset:0;background:color-mix(in srgb,var(--kimi-color-text-primary) 40%,transparent)}
.mbox{position:relative;box-sizing:border-box;background:var(--kimi-color-surface-raised);border:1px solid var(--kimi-color-border);border-radius:16px;padding:18px;width:100%;max-width:740px;max-height:94vh;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.22)}
</style>

var S;

if(S.settlements&&!S.sales){
  S.sales=[];S.payments=S.payments||[];
  var agg={};
  S.settlements.forEach(function(r){
    S.sales.push({id:uid(),storeId:r.storeId,productId:r.productId,qty:+r.soldQty||0,date:r.date,note:''});
    var k=r.storeId+'|'+(r.date||'').slice(0,7);
    if(!agg[k])agg[k]={storeId:r.storeId,month:(r.date||'').slice(0,7),amount:0,status:r.status||'unpaid',date:r.date};
    agg[k].amount+=+r.amount||0;
    if(r.date>=agg[k].date){agg[k].date=r.date;agg[k].status=r.status}
  });
  for(var k in agg)S.payments.push({id:uid(),storeId:agg[k].storeId,month:agg[k].month,amount:agg[k].amount,status:agg[k].status,date:agg[k].date,note:''});

function prod(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null}
function store(id){for(var i=0;i<S.stores.length;i++)if(S.stores[i].id===id)return S.stores[i];return null}
function lineOf(id){for(var i=0;i<S.lines.length;i++)if(S.lines[i].id===id)return S.lines[i];return null}
function compOf(id){for(var i=0;i<S.comps.length;i++)if(S.comps[i].id===id)return S.comps[i];return null}
function lineStores(lid){return S.stores.filter(function(st){return (st.line||'l1')===lid})}
function lineProds(lid){return S.products.filter(function(p){return (p.line||'l1')===lid})}
function compColor(c){var i=S.comps.indexOf(c);return PALETTE[(i<0?0:i)%PALETTE.length]}
function diyCost(diy){var t=0,tally={};(diy||[]).forEach(function(it){tally[it.cid]=(tally[it.cid]||0)+1});for(var cid in tally){var c=compOf(cid);if(c)t+=tally[cid]*(c.shape==='chain'?0.5:1)*(+c.cost||0)}return Math.round(t*100)/100}
function laborCost(p){var t=p.time||{base:0,asm:0};return Math.round(((+t.base||0)+(+t.asm||0))/60*(S.settings.wagePerHour||30)*100)/100}
function compUsed(cid){var n=0;S.products.forEach(function(p){(p.diy||[]).forEach(function(it){if(it.cid===cid)n++})});return n}
function stIdx(id){var st=store(id);if(!st)return -1;var lst=lineStores(st.line||'l1');return lst.indexOf(st)}
function stNo(id){var i=stIdx(id);return i<0?'':(i+1)}
function settlePrice(p,st){return Math.round((+p.price||0)*(st?+st.ratio:0)*100)/100}
function shipped(storeId,pid){var n=0;S.shipments.forEach(function(r){if(r.storeId===storeId&&r.productId===pid)n+=+r.qty});return n}
function sold(storeId,pid){var n=0;S.sales.forEach(function(r){if(r.storeId===storeId&&r.productId===pid)n+=+r.qty});return n}
function soldAll(pid){var n=0;S.sales.forEach(function(r){if(r.productId===pid)n+=+r.qty});return n}
function soldMonth(storeId,pid,m){var n=0;S.sales.forEach(function(r){if(r.storeId===storeId&&r.productId===pid&&r.date.slice(0,7)===m)n+=+r.qty});return n}
function shippedMonth(storeId,pid,m){var n=0;S.shipments.forEach(function(r){if(r.storeId===storeId&&r.productId===pid&&r.date.slice(0,7)===m)n+=+r.qty});return n}
function owing(sid){var n=0;S.payments.forEach(function(r){if(r.status!=='paid'&&(!sid||r.storeId===sid))n+=+r.amount});return n}
function paidTotal(){var n=0;S.payments.forEach(function(r){if(r.status==='paid')n+=+r.amount});return n}
function lastPayDate(sid){
  var d=null;
  S.payments.forEach(function(r){if(r.storeId===sid&&(!d||r.date>d))d=r.date});
  if(!d)[].concat(S.shipments,S.sales).forEach(function(r){if(r.storeId===sid&&(!d||r.date>d))d=r.date});
  return d;
}
function storeRows(sid){
  var map={},order=[];
  S.shipments.forEach(function(r){if(r.storeId===sid&&!map[r.productId]){map[r.productId]=1;order.push(r.productId)}});
  return order.map(function(pid){var sh=shipped(sid,pid),so=sold(sid,pid);return{pid:pid,shipped:sh,sold:so,left:sh-so}});
}
function storeMonths(sid){
  var m={};
  function add(d){if(d)m[d.slice(0,7)]=1}
  S.shipments.forEach(function(r){if(r.storeId===sid)add(r.date)});
  S.sales.forEach(function(r){if(r.storeId===sid)add(r.date)});
  S.payments.forEach(function(r){if(r.storeId===sid&&r.month)m[r.month]=1});
  return Object.keys(m).sort().reverse();
}
function paymentOf(sid,m){for(var i=0;i<S.payments.length;i++){var r=S.payments[i];if(r.storeId===sid&&r.month===m)return r}return null}
function allAlerts(lid){
  var low=[],over=[];
  lineStores(lid).forEach(function(st){
    if(isStopped(st))return;
    storeRows(st.id).forEach(function(r){
      if(r.shipped>0&&r.left<=S.settings.lowStock)low.push({sid:st.id,store:st.name,pid:r.pid,left:r.left});
    });
    var d=lastPayDate(st.id);
    if(d){var gap=daysBetween(d,today());if(gap>S.settings.alertDays)over.push({sid:st.id,store:st.name,date:d,gap:gap})}
  });
  return{low:low,over:over};
}
function thumb(p,sz){
  sz=sz||36;
  if(p&&p.img)return '<img class="thumb" style="width:'+sz+'px;height:'+sz+'px" src="'+p.img+'">';
  var ch=p?(p.cat==='项链'?'项':p.cat==='耳饰'?'耳':p.cat==='手链'?'手':p.cat==='戒指'?'戒':'饰'):'?';
  return '<span class="thumb '+(CATCLR[p?p.cat:'其他']||'c-gray')+'" style="width:'+sz+'px;height:'+sz+'px">'+ch+'</span>';
}
function chip(t,cls){return '<span class="chip '+cls+'">'+t+'</span>'}
function node0(c,color){
  if(c.img)return '<image href="'+c.img+'" x="-10" y="-10" width="20" height="20"/>';
  if(c.shape==='ring')return '<circle r="6" fill="none" stroke="'+color+'" stroke-width="2.5"/>';
  if(c.shape==='clasp')return '<rect x="-9" y="-4" width="18" height="8" rx="4" fill="'+color+'"/>';
  if(c.shape==='chain')return '<path d="M-9,0 L9,0" stroke="'+color+'" stroke-width="2" stroke-dasharray="3,2.5"/>';
  if(c.shape==='stud')return '<circle cy="2" r="5.5" fill="'+color+'"/><path d="M-5,-7 L5,-7" stroke="'+color+'" stroke-width="2.5"/>';
  return '<circle r="8" fill="'+color+'"/>';
}

function updCostLine(){

  var a=parseFloat((document.getElementById('rc-asm')||{}).value)||0;

  var p=prod(RECIPE)||{price:0};

  el=document.getElementById('rc-labor');if(el)el.textContent='¥'+fmt(lab);

  el=document.getElementById('rc-margin');if(el)el.textContent=(p.price?('毛利率 '+Math.round((1-total/p.price)*100)+'%（售价 ¥'+fmt(p.price)+'）'):'—');
}
function svgPt(svg,cx,cy){var r=svg.getBoundingClientRect();return{x:(cx-r.left)/r.width*620,y:(cy-r.top)/r.height*320}}
var SNAP=20;
function snapX(v){return Math.max(20,Math.min(600,Math.round(v/SNAP)*SNAP))}
function snapY(v){return Math.max(20,Math.min(300,Math.round(v/SNAP)*SNAP))}
app.addEventListener('pointerdown',function(e){
  var chipEl=e.target.closest('.palchip');
  if(chipEl){
    DIY_DRAG={cid:chipEl.dataset.cid,moved:0,sx:e.clientX,sy:e.clientY};
    GHOST=document.createElement('div');GHOST.className='dragghost';GHOST.textContent=chipEl.textContent;
    GHOST.style.left=(e.clientX+10)+'px';GHOST.style.top=(e.clientY+10)+'px';
    document.body.appendChild(GHOST);
    e.preventDefault();
    return;
  }
  var g=e.target.closest('#diy-svg [data-idx]');
  if(g){
    DIY_DRAG={idx:+g.dataset.idx,moved:0,sx:e.clientX,sy:e.clientY};
    e.preventDefault();
  }
});
document.addEventListener('pointermove',function(e){
  if(!DIY_DRAG)return;
  DIY_DRAG.moved=Math.max(DIY_DRAG.moved,Math.abs(e.clientX-DIY_DRAG.sx)+Math.abs(e.clientY-DIY_DRAG.sy));
  if(DIY_DRAG.cid){
    if(GHOST){GHOST.style.left=(e.clientX+10)+'px';GHOST.style.top=(e.clientY+10)+'px'}
  }else{
    var svg=document.getElementById('diy-svg');if(!svg)return;
    var pt=svgPt(svg,e.clientX,e.clientY);
    var it=DRAFT[DIY_DRAG.idx];if(!it)return;
    it.x=snapX(pt.x);it.y=snapY(pt.y);
    var el=svg.querySelector('[data-idx="'+DIY_DRAG.idx+'"]');
    if(el)el.setAttribute('transform','translate('+it.x+','+it.y+')');
  }
});
document.addEventListener('pointerup',function(e){
  if(!DIY_DRAG)return;
  var d=DIY_DRAG;DIY_DRAG=null;
  if(GHOST){GHOST.remove();GHOST=null}
  if(d.cid){
    var svg=document.getElementById('diy-svg');
    if(svg){
      var r=svg.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
        var pt=svgPt(svg,e.clientX,e.clientY);
        DRAFT.push({cid:d.cid,x:snapX(pt.x),y:snapY(pt.y)});
        SEL_INST=DRAFT.length-1;
      }
    }
    render();
  }else{
    if(d.moved<4){SEL_INST=(SEL_INST===d.idx?null:d.idx)}
    render();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&RECIPE){RECIPE=null;DRAFT=[];SEL_INST=null;render()}
});
function onImg(cb){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,400/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.8));
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}
function onPhotos(){
  var files=this.files;if(!files||!files.length)return;
  var note=(document.getElementById('photo-note')||{}).value||'';
  var pending=files.length,dt=today();
  for(var i=0;i<files.length;i++){
    (function(f){
      var r=new FileReader();
      r.onload=function(ev){
        var img=new Image();
        img.onload=function(){
          var s=Math.min(1,500/Math.max(img.width,img.height));
          var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          S.photos.push({id:uid(),storeId:SEL,date:dt,note:note,img:c.toDataURL('image/jpeg',0.8)});
          if(--pending===0){save();render()}
        };
        img.src=ev.target.result;
      };
      r.readAsDataURL(f);
    })(files[i]);
  }
}
function attachPicker(pre){
  var inp=document.getElementById(pre+'-in'),drop=document.getElementById(pre+'-drop');
  inp.oninput=function(){
    var q=inp.value.trim().toLowerCase();
    if(!q){drop.hidden=true;return}
    var hits=lineProds(LIN).filter(function(p){return p.code.toLowerCase().indexOf(q)>-1||p.name.toLowerCase().indexOf(q)>-1}).slice(0,8);
    drop.innerHTML=hits.map(function(p){return '<div class="pk-item" data-pid="'+p.id+'">'+thumb(p,28)+'<span>'+esc(p.code)+' '+esc(p.name)+'</span></div>'}).join('')
      ||'<div class="pk-item muted">未找到该货品，请先在「货品」清单中录入</div>';
    drop.hidden=false;
  };
  drop.onclick=function(e){
    var it=e.target.closest('[data-pid]');if(!it)return;
    var p=prod(it.dataset.pid);if(!p)return;
    if(pre==='xp'){
      var ex=qo(EXTRA,SEL);
      if(!ex[p.id])ex[p.id]=1;
      inp.value='';drop.hidden=true;render();return;
    }
  };
}

function vMapBlock(){
  var located=[],unknown=[];
  lineStores(LIN).forEach(function(st){
    if(st.city&&CITY[st.city])located.push(st);
    else unknown.push(st);
  });
  var byCity={};
  located.forEach(function(st){
    if(!byCity[st.city])byCity[st.city]=[];
    byCity[st.city].push(st);
  });
  var cities=Object.keys(byCity);
  if(!MAPCITY||!byCity[MAPCITY])MAPCITY=cities[0]||null;
  function projW(lon,lat){return [(lon+180)/360*1000,(88-lat)/148*640]}
  function pathD(pts){var d='M';pts.forEach(function(p,i){var xy=projW(p[0],p[1]);d+=(i?'L':'')+xy[0].toFixed(1)+','+xy[1].toFixed(1)});return d+'Z'}
  var h='<h2 class="sec">销售地图 · '+esc(curLine().name)+'</h2>';
  if(!lineStores(LIN).length)return h+'<div class="note">该品类还没有店铺，到「店铺」页添加后这里会显示销售地图。</div>';
  var svg='<svg viewBox="0 0 1000 640" style="width:100%;height:auto">';
  WORLD.forEach(function(pts){svg+='<path d="'+pathD(pts)+'" fill="color-mix(in srgb, var(--kimi-color-text-primary) 5%, transparent)" stroke="var(--kimi-color-border)" stroke-width="1"/>'});
  cities.forEach(function(c){
    var sts=byCity[c];
    var soldAll2=0,activeN=0;
    sts.forEach(function(st){soldAll2+=storeRows(st.id).reduce(function(a,r){return a+r.sold},0);if(!isStopped(st))activeN++});
    var xy=projW(CITY[c][0],CITY[c][1]);
    var r=6+Math.min(14,soldAll2/4);
    var on=MAPCITY===c;
    var lx=Math.max(24,Math.min(976,xy[0]));
    svg+='<g class="mapdot" data-act="mapsel" data-city="'+esc(c)+'">'
     +'<circle class="halo" cx="'+xy[0]+'" cy="'+xy[1]+'" r="'+(r+5)+'" fill="none" stroke="'+(on?'var(--kimi-color-text-primary)':'transparent')+'" stroke-width="1.5"/>'
     +'<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="'+r+'" fill="color-mix(in srgb, var(--kimi-chart-1) '+(on?'45%':'28%')+', transparent)" stroke="var(--kimi-color-surface)" stroke-width="1.5"/>'
     +'<text class="maplbl" x="'+lx+'" y="'+(xy[1]-r-8)+'" text-anchor="middle" font-size="12" font-weight="500" fill="var(--kimi-color-text-primary)">'+esc(c)+(activeN===0?'（全停）':'')+'</text>'
     +'<text x="'+xy[0]+'" y="'+(xy[1]+4)+'" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">'+soldAll2+'</text>'
     +'</g>';
  });
  svg+='</svg>';

      h+='<td class="num" style="text-align:center">'+tLeft+'</td></tr>';

  }
  return h;

function vFinance(){
  var prods=lineProds(LIN),lname=curLine().name,cm=today().slice(0,7);
  var wage=S.settings.wagePerHour||30;
  var shareR=(S.settings.shareRatio==null?0.5:S.settings.shareRatio);
  var lst=lineStores(LIN);
  var rows=prods.map(function(p){
    var mat=diyCost(p.diy);
    var lab=laborCost(p);
    var cost=Math.round((mat+lab)*100)/100;
    var price=+p.price||0;
    var share=Math.round(price*shareR*100)/100;
    var net=Math.round((price-cost-share)*100)/100;
    var margin=Math.round((price-cost)*100)/100;
    var so=soldAll(p.id);
    var soM=0;lst.forEach(function(st){soM+=soldMonth(st.id,p.id,cm)});
    var left=0,first=null;
    lst.forEach(function(st){
      left+=shipped(st.id,p.id)-sold(st.id,p.id);
    });
    S.shipments.forEach(function(r){if(r.productId===p.id&&(!first||r.date<first))first=r.date});
    var days=first?Math.max(1,daysBetween(first,today())):0;
    var daily=(so>0&&days>0)?so/days:0;
    var clear=(daily>0&&left>0)?Math.ceil(left/daily):null;
    var byStore=[];
    lst.forEach(function(st){
      var l=shipped(st.id,p.id)-sold(st.id,p.id);
      if(l>0)byStore.push({st:st,left:l});
    });
    return{p:p,mat:mat,lab:lab,cost:cost,price:price,share:share,net:net,margin:margin,so:so,soM:soM,left:left,days:days,daily:daily,clear:clear,byStore:byStore,
      netAll:Math.round(net*so*100)/100,netM:Math.round(net*soM*100)/100,occ:Math.round(cost*left*100)/100};
  });
  var tSold=0,tNet=0,tNetM=0,tOcc=0,tLeft=0,tDaily=0,tRev=0,tGross=0;
  rows.forEach(function(r){tSold+=r.so;tNet+=r.netAll;tNetM+=r.netM;tOcc+=r.occ;tLeft+=r.left;tDaily+=r.daily;tRev+=r.price*r.so;tGross+=(r.price-r.cost)*r.so});
  rows.sort(function(a,b){return b.netAll-a.netAll||b.so-a.so});
  var h='<div class="note">财务统计 · '+esc(lname)+'。单件总成本 = 用料 + 人力（¥'+fmt(wage)+'/小时）；分成 = 售价 × '+Math.round(shareR*100)+'%（计入成本）；单件净利 = 售价 − 总成本 − 分成。周转：动销天数 = 首次出货至今；日均卖出 = 累计售出 ÷ 动销天数；预计清货 = 在店 ÷ 日均卖出（按当前动销速度卖完要几天）。点击「在店」可看每家店各剩几件。</div>';
  h+='<div class="kpis">'
   +kpi(tSold,'累计售出（件）')
   +kpi('¥'+fmt(tNet),'累计净利')
   +kpi('¥'+fmt(tNetM),'本月净利')
   +kpi('¥'+fmt(tGross),'累计毛利（分成前）')
   +kpi('¥'+fmt(tOcc),'库存占用成本')
   +(tDaily>0?kpi(Math.ceil(tLeft/tDaily)+' 天','按当前动销清完在店'):'')
   +'</div>';
  h+='<div class="tscroll"><table class="tb"><thead><tr><th></th><th>货号 / 名称</th><th class="num">售价</th><th class="num">用料</th><th class="num">人力</th><th class="num">总成本</th><th class="num">分成</th><th class="num">单件净利</th><th class="num">累计售出</th><th class="num">日均卖出</th><th class="num">预计清货</th><th class="num">累计净利</th><th class="num">本月净利</th><th class="num">在店</th><th class="num">库存占用</th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="15" class="muted">该品类还没有货品</td></tr>';
  rows.forEach(function(r){
    var p=r.p;
    var clearTxt=(r.clear!=null&&isFinite(r.clear))?(r.clear>365?'＞1年':r.clear+' 天'):(r.so>0?'—':'未动销');
    h+='<tr><td>'+thumb(p,28)+'</td>'
     +'<td><div class="pname">'+esc(p.name)+'</div><div class="pcode">'+esc(p.code)+(r.days?(' · 动销 '+r.days+' 天'):' · 未出货')+'</div></td>'
     +'<td class="num">'+(r.price?'¥'+fmt(r.price):'—')+'</td>'
     +'<td class="num">'+(r.mat?'¥'+fmt(r.mat):'—')+'</td>'
     +'<td class="num">'+(r.lab?'¥'+fmt(r.lab):'—')+'</td>'
     +'<td class="num" style="font-weight:500">'+(r.cost?'¥'+fmt(r.cost):'—')+'</td>'
     +'<td class="num">'+(r.price?'¥'+fmt(r.share):'—')+'</td>'
     +'<td class="num" style="font-weight:500;color:'+(r.net>=0?'var(--kimi-color-positive)':'var(--kimi-color-danger)')+'">'+(r.price?'¥'+fmt(r.net):'—')+'</td>'
     +'<td class="num">'+r.so+'</td>'
     +'<td class="num">'+(r.daily?r.daily.toFixed(2):'—')+'</td>'
     +'<td class="num">'+clearTxt+'</td>'
     +'<td class="num" style="font-weight:500">'+(r.netAll?'¥'+fmt(r.netAll):'—')+'</td>'
     +'<td class="num">'+(r.netM?'¥'+fmt(r.netM):'—')+'</td>'
     +'<td class="num">'+(r.left>0?'<button class="btn ghost sm" data-act="finstore" data-id="'+p.id+'">'+r.left+' 件 · 分布</button>':'—')+'</td>'
     +'<td class="num">'+(r.occ?'¥'+fmt(r.occ):'—')+'</td></tr>';
    if(FINSTORE===p.id){
      h+='<tr><td></td><td colspan="14" style="background:var(--kimi-color-surface-muted)"><div style="padding:6px 4px;font-size:13px"><span class="muted">在店分布：</span>'
       +(r.byStore.length?r.byStore.map(function(b){return '<span class="chip c-blue" style="margin-right:6px">'+esc(b.st.name.replace(/（示例）/g,''))+' × '+b.left+'</span>'}).join(''):'<span class="muted">暂无在店</span>')
       +'</div></td></tr>';
    }
  });
  h+='<tr style="font-weight:500;background:var(--kimi-color-surface-muted)"><td></td><td>合计</td><td></td><td></td><td></td><td></td><td></td><td></td>'
   +'<td class="num">'+tSold+'</td><td class="num">'+(tDaily?tDaily.toFixed(2):'—')+'</td><td></td>'
   +'<td class="num">¥'+fmt(tNet)+'</td><td class="num">¥'+fmt(tNetM)+'</td><td class="num">'+tLeft+'</td><td class="num">¥'+fmt(tOcc)+'</td></tr>';
  return h+'</tbody></table></div>'
   +'<div class="muted" style="margin-top:6px">分成比例在「数据与设置 → 提醒与成本设置」修改（当前 '+Math.round(shareR*100)+'%）；工时单价同上。周转按各店合计口径。</div>';
}

    h+='<td class="num">'+r.shipped+'</td><td class="num">'+r.sold+'</td><td class="num">'+r.left+'</td></tr>';

  var a=loadSnaps();
  a.unshift({t:new Date().toLocaleString('zh-CN',{hour12:false}),label:label||'手动快照',data:JSON.parse(JSON.stringify(S))});
  while(a.length>8)a.pop();

}

function syncOn(){return typeof SYNC!=='undefined'&&!!(SYNC.pat&&SYNC.gist)}
function setSyncStatus(t){var el=document.getElementById('sync-status');if(el)el.textContent=t}
function schedulePush(){if(!syncOn())return;SYNC.dirty=true;if(SYNC.pushTimer)return;SYNC.pushTimer=setTimeout(function(){SYNC.pushTimer=null;pushSync()},1200)}
function pushSync(){
 if(!syncOn()||!SYNC.dirty)return;
 var text=JSON.stringify(S,null,1);
 setSyncStatus('同步中…');
 fetch('https://api.github.com/gists/'+SYNC.gist,{method:'PATCH',headers:{'Authorization':'token '+SYNC.pat,'Content-Type':'application/json'},body:JSON.stringify({files:{'ledger.json':{content:text}}})})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);SYNC.dirty=false;SYNC.lastRemote=text;setSyncStatus('已同步 '+new Date().toLocaleTimeString())})
 .catch(function(e){setSyncStatus('同步失败：'+e.message)});
}
function fixData(d){
 d.sales=d.sales||[];d.payments=d.payments||[];d.photos=d.photos||[];
 d.settings=d.settings||{lowStock:2,alertDays:30,wagePerHour:30};
 if(d.settings.wagePerHour==null)d.settings.wagePerHour=30;
 if(!d.lines||!d.lines.length)d.lines=[{id:'l1',name:'饰品'}];
 if(!d.comps)d.comps=[];
 d.stores.forEach(function(st){if(st.ratio==null||isNaN(+st.ratio))st.ratio=0.6;if(st.city==null)st.city='';if(st.intro==null)st.intro='';if(st.status==null)st.status='active';if(st.line==null)st.line='l1';if(st.mail==null)st.mail=''});
 d.products.forEach(function(p){if(p.line==null)p.line='l1';if(p.time==null)p.time={base:0,asm:0};if(p.diy==null)p.diy=[]});
 return d;
}
function pullSync(){
 if(!SYNC.gist)return;
 fetch('https://api.github.com/gists/'+SYNC.gist).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(g){
  var f=g.files&&g.files['ledger.json'];
  if(!f||!f.raw_url||SYNC.dirty)return;
  fetch(f.raw_url).then(function(r){return r.text()}).then(function(text){
   if(!text||text===SYNC.lastRemote)return;
   try{
    var d=fixData(JSON.parse(text));
    S=d;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    SYNC.lastRemote=text;
    if(!lineOf(LIN))LIN=S.lines[0].id;
    SEL=null;ORDER=null;MAPCITY=null;RECIPE=null;OVEXPAND=false;
    setSyncStatus('已获取他人更新 '+new Date().toLocaleTimeString());
    render();
   }catch(e){}
  });
 }).catch(function(){});
}
function startWatch(){
 if(SYNC.watchTimer){clearInterval(SYNC.watchTimer);SYNC.watchTimer=null}
 if(SYNC.gist){SYNC.watchTimer=setInterval(pullSync,5000);pullSync()}
}
function download(name,content,mime){
  var b=content instanceof Blob?content:new Blob([content],{type:mime||'application/octet-stream'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},100);
}

    });
  });

  S.payments.filter(function(r){var st=store(r.storeId);return st&&(st.line||'l1')===LIN})

function orderPNG(){
  var st=store(ORDER.storeId);
  var items=orderItems();
  var W=820,pad=24,rowH=76,headH=96,footH=64;
  var H=pad*2+headH+items.length*rowH+footH;
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var c=cv.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.fillStyle='#161616';c.font='500 24px sans-serif';
  c.fillText('补货订货单',pad,pad+28);
  c.font='13px sans-serif';c.fillStyle='#666666';
  c.fillText('店铺：'+(st?st.name:'')+'（结算比例 '+Math.round(st?st.ratio*100:0)+'%）    日期：'+ORDER.date+'    共 '+items.length+' 款 / '+ORDER.totQty+' 件',pad,pad+54);
  var y=pad+headH;
  c.strokeStyle='#dddddd';c.lineWidth=1;
  c.beginPath();c.moveTo(pad,y-24);c.lineTo(W-pad,y-24);c.stroke();
  c.font='12px sans-serif';c.fillStyle='#999999';
  var cols=[pad+4,pad+76,pad+330,pad+460,pad+580];
  ['图片','货品','售价','结算价','数量'].forEach(function(t,i){c.fillText(t,cols[i],y-8)});
  var i=0;
  function rr(x,y2,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y2,w,h,r);else c.rect(x,y2,w,h)}
  function drawRow(){
    if(i>=items.length){
      c.strokeStyle='#dddddd';c.beginPath();c.moveTo(pad,y);c.lineTo(W-pad,y);c.stroke();
      c.font='500 15px sans-serif';c.fillStyle='#161616';
      c.fillText('合计：'+ORDER.totQty+' 件    结算金额：¥'+fmt(ORDER.totAmt),pad,y+34);
      download('订货单_'+(st?st.name:'')+'_'+ORDER.date+'.png',dataURLtoBlob(cv.toDataURL('image/png')),'image/png');
      return;
    }
    var it=items[i],ry=y+i*rowH;
    c.strokeStyle='#eeeeee';c.beginPath();c.moveTo(pad,ry+rowH-6);c.lineTo(W-pad,ry+rowH-6);c.stroke();
    c.font='14px sans-serif';c.fillStyle='#161616';
    c.fillText((it.p?it.p.name:'').slice(0,14),cols[1],ry+34);
    c.font='12px sans-serif';c.fillStyle='#999999';
    c.fillText(it.p?it.p.code:'',cols[1],ry+54);
    c.font='13px sans-serif';c.fillStyle='#333333';
    c.fillText(it.p?'¥'+fmt(it.p.price):'—',cols[2],ry+42);
    c.fillText('¥'+fmt(it.sp),cols[3],ry+42);
    c.font='500 13px sans-serif';c.fillStyle='#161616';
    c.fillText('× '+it.qty,cols[4],ry+42);
    if(it.p&&it.p.img){
      var img=new Image();
      img.onload=function(){c.save();rr(cols[0],ry+10,52,52,8);c.clip();c.drawImage(img,cols[0],ry+10,52,52);c.restore();i++;drawRow()};
      img.onerror=function(){i++;drawRow()};
      img.src=it.p.img;
    }else{
      c.fillStyle='#f0f0f0';rr(cols[0],ry+10,52,52,8);c.fill();
      c.fillStyle='#999999';c.font='500 16px sans-serif';
      var ch=it.p?(it.p.cat==='项链'?'项':it.p.cat==='耳饰'?'耳':it.p.cat==='手链'?'手':it.p.cat==='戒指'?'戒':'饰'):'?';
      c.fillText(ch,cols[0]+20,ry+42);
      i++;drawRow();
    }
  }
  drawRow();
}
function dataURLtoBlob(d){
  var arr=d.split(','),mime=arr[0].match(/:(.*?);/)[1],bstr=atob(arr[1]),n=bstr.length,u=new Uint8Array(n);
  while(n--)u[n]=bstr.charCodeAt(n);
  return new Blob([u],{type:mime});
}

app.addEventListener('click',function(e){
  var gt=e.target&&e.target.closest?e.target.closest('input[name="gtab"]'):null;
  if(gt){PTAB=gt.value;RECIPE=null;FINSTORE=null;render();return}
  var st2=e.target&&e.target.closest?e.target.closest('input[name="stab"]'):null;
  if(st2){STAB=st2.value;render();return}
  var t=e.target&&e.target.closest?e.target.closest('[data-tab],[data-act]'):null;if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  var act=t.dataset.act,id=t.dataset.id;
  if(act==='sopen'){SEL=id;TAB='stores';ORDER=null;render();window.scrollTo(0,0)}
  else if(act==='sback'){SEL=null;render()}
  else if(act==='mprev'){CUR=shiftMonth(CUR,-1);render()}
  else if(act==='mnext'){CUR=shiftMonth(CUR,1);render()}
  else if(act==='mnow'){CUR=today().slice(0,7);render()}
  else if(act==='mapsel'){MAPCITY=t.dataset.city;render()}
  else if(act==='ovpay'){OVEXPAND=!OVEXPAND;render()}
  else if(act==='finstore'){FINSTORE=(FINSTORE===id?null:id);render()}
  else if(act==='ststop'){var st=store(id);if(st&&confirm('停止与「'+st.name+'」的合作？\n历史记录将完整保留，该店不再出现在提醒中，也不能再登记新账。')){st.status='stopped';save();render()}}
  else if(act==='stresume'){var st=store(id);if(st&&confirm('恢复与「'+st.name+'」的合作？')){st.status='active';save();render()}}
  else if(act==='photodel'&&confirm('删除这张照片？')){S.photos=S.photos.filter(function(r){return r.id!==id});save();render()}
  else if(act==='precipe'){
    try{
      var pp=prod(id);if(!pp)return;
      RECIPE=id;DRAFT=(pp.diy||[]).map(function(it){return{cid:it.cid,x:snapX(it.x),y:snapY(it.y)}});SEL_INST=null;
      render();
    }catch(err){alert('打开用料编辑器失败：'+err.message)}
  }
  else if(act==='rcdel'){if(SEL_INST!=null){DRAFT.splice(SEL_INST,1);SEL_INST=null}render()}
  else if(act==='rcclear'){DRAFT=[];SEL_INST=null;render()}
  else if(act==='rcsave'){
    try{
      var pp2=prod(id);if(pp2){
        pp2.diy=DRAFT.map(function(it){return{cid:it.cid,x:it.x,y:it.y}});
        var b=parseFloat((document.getElementById('rc-base')||{}).value)||0;
        var a=parseFloat((document.getElementById('rc-asm')||{}).value)||0;
        pp2.time={base:b,asm:a};
        save();
      }
      RECIPE=null;DRAFT=[];SEL_INST=null;render();
    }catch(err){alert('保存失败：'+err.message)}
  }
  else if(act==='rccancel'){RECIPE=null;DRAFT=[];SEL_INST=null;render()}
  else if(act==='cedit'){
    var c=compOf(id);if(!c)return;
    var nm=prompt('配件名称：',c.name);if(nm===null)return;
    var co=prompt('单价（元）：',c.cost);if(co===null)return;
    var un=prompt('单位（个/对/cm）：',c.unit);if(un===null)return;
    if(nm.trim())c.name=nm.trim();
    var cv=parseFloat(co);if(!isNaN(cv))c.cost=cv;
    if(un.trim())c.unit=un.trim();
    save();render();

  else if(act==='cdel'&&confirm('删除这个配件？')){
    if(compUsed(id)){alert('该配件已被货品引用，无法删除');return}

  }
  else if(act==='sqty'){

    var obj=f==='ship'?qo(QSHIP,SEL):qo(QSALE,SEL);
    obj[pid]=(obj[pid]||0)+d;
    if(obj[pid]<0)obj[pid]=0;
    if(f==='sale'){var left=shipped(SEL,pid)-sold(SEL,pid);if(obj[pid]>left)obj[pid]=left}
    render();
  }
  else if(act==='shipgo'){
    var qs2=qo(QSHIP,SEL),st3=store(SEL);
    var items=[],totQty=0,totAmt=0;
    Object.keys(qs2).forEach(function(pid){
      var q=qs2[pid];if(!q)return;var p=prod(pid);if(!p)return;
      var sp=settlePrice(p,st3);items.push({pid:pid,qty:q,sub:sp*q});totQty+=q;totAmt+=sp*q;
    });
    if(!items.length){alert('请先给至少一款货选择数量');return}
    var dt=(document.getElementById('sh-date')||{}).value||today();
    items.forEach(function(it){S.shipments.push({id:uid(),storeId:SEL,productId:it.pid,qty:it.qty,date:dt,note:''})});
    ORDER={storeId:SEL,date:dt,items:items,totQty:totQty,totAmt:totAmt};
    PHOTO_WARN={storeId:SEL,date:dt};
    QSHIP[SEL]={};EXTRA[SEL]={};
    save();render();window.scrollTo(0,0);
  }
  else if(act==='salego'){
    var qa2=qo(QSALE,SEL),made=0;
    var dt2=(document.getElementById('sa-date')||{}).value||today();
    Object.keys(qa2).forEach(function(pid){
      var q=qa2[pid];if(!q)return;
      S.sales.push({id:uid(),storeId:SEL,productId:pid,qty:q,date:dt2,note:''});made++;
    });
    if(!made){alert('请先给至少一款货选择数量');return}
    QSALE[SEL]={};
    save();render();
  }
  else if(act==='orderpng'){orderPNG()}
  else if(act==='orderxls'){orderXLS()}
  else if(act==='orderclose'){ORDER=null;render()}
  else if(act==='lnren'){var ln=lineOf(id);if(!ln)return;var nn=prompt('品类名称：',ln.name);if(nn===null)return;if(!nn.trim())return;ln.name=nn.trim();save();render()}
  else if(act==='lndel'){
    var ln2=lineOf(id);if(!ln2)return;
    if(S.lines.length<=1){alert('至少保留一个品类');return}
    if(lineStores(id).length||lineProds(id).length){alert('该品类下还有店铺或货品，无法删除。请先清空或改用其他品类。');return}
    if(confirm('删除品类「'+ln2.name+'」？')){S.lines=S.lines.filter(function(l){return l.id!==id});if(LIN===id)LIN=S.lines[0].id;save();render()}
  }
  else if(act==='hdel'&&confirm('删除这条出货记录？')){S.shipments=S.shipments.filter(function(r){return r.id!==id});save();render()}
  else if(act==='sadel'&&confirm('删除这条售出记录？')){S.sales=S.sales.filter(function(r){return r.id!==id});save();render()}
  else if(act==='paydel'&&confirm('删除这条回款记录？')){S.payments=S.payments.filter(function(r){return r.id!==id});save();render()}
  else if(act==='payok'){var pay=null;S.payments.forEach(function(r){if(r.id===id)pay=r});if(pay&&confirm('把这笔回款标记为「已回款」？')){pay.status='paid';save();render()}}
  else if(act==='pdel'&&confirm('删除这个货品？有出货记录的货品不可删除。')){S.products=S.products.filter(function(p){return p.id!==id});save();render()}
  else if(act==='pedit'){
    var p=prod(id);if(!p)return;
    var cd=prompt('货号：',p.code);if(cd===null)return;
    var nm=prompt('货品名称：',p.name);if(nm===null)return;
    var pr=prompt('售价（元）：',p.price||'');if(pr===null)return;
    if(cd.trim())p.code=cd.trim();p.name=nm.trim()||p.name;p.price=parseFloat(pr)||0;save();render();
  }
  else if(act==='stdel'&&confirm('删除这个店铺？其出货、售出与回款记录也会一并删除。建议优先使用「停止合作」保留历史。')){
    S.stores=S.stores.filter(function(s){return s.id!==id});
    S.shipments=S.shipments.filter(function(r){return r.storeId!==id});
    S.sales=S.sales.filter(function(r){return r.storeId!==id});
    S.payments=S.payments.filter(function(r){return r.storeId!==id});
    S.photos=S.photos.filter(function(r){return r.storeId!==id});
    if(SEL===id)SEL=null;
    save();render();
  }
  else if(act==='stedit'){
    var st=store(id);if(!st)return;
    var ct=prompt('所在城市：',st.city||'');if(ct===null)return;
    var c2=prompt('联系方式：',st.contact||'');if(c2===null)return;
    var ml=prompt('邮寄信息：',st.mail||'');if(ml===null)return;
    var ra=prompt('结算比例（%）：',Math.round(st.ratio*100));if(ra===null)return;
    var it2=prompt('一句话介绍：',st.intro||'');if(it2===null)return;
    st.city=ct.trim();st.contact=c2.trim();st.mail=ml.trim();st.intro=it2.trim();
    var rv=parseFloat(ra);if(!isNaN(rv))st.ratio=Math.min(100,Math.max(0,rv))/100;
    save();render();
  }
  else if(act==='saveset'){
    S.settings.lowStock=Math.max(0,parseInt(document.getElementById('set-low').value)||0);
    S.settings.alertDays=Math.max(1,parseInt(document.getElementById('set-days').value)||30);
    var wg=parseFloat(document.getElementById('set-wage').value);
    if(!isNaN(wg))S.settings.wagePerHour=Math.max(0,wg);
    var sr=parseFloat(document.getElementById('set-share').value);
    if(!isNaN(sr))S.settings.shareRatio=Math.min(100,Math.max(0,sr))/100;
    save();render();
  }
  else if(act==='expjson'){download('寄售台账备份_'+today()+'.json',JSON.stringify(S,null,1),'application/json')}
  else if(act==='expcsv'){expCSV()}
  else if(act==='snapnew'){
    var lb=prompt('快照备注（可留空）：','手动快照');
    if(lb===null)return;
    addSnap(lb.trim()||'手动快照');
    render();
  }
  else if(act==='snapback'){applySnap(+t.dataset.i)}
  else if(act==='snapdl'){
    var sa=loadSnaps();var si=+t.dataset.i;
    if(sa[si])download('寄售台账快照_'+sa[si].t.replace(/[/:]/g,'-')+'.json',JSON.stringify(sa[si].data,null,1),'application/json');
  }
  else if(act==='syncnew'){
    var pat=((document.getElementById('sync-pat')||{}).value||'').trim();
    if(!pat){alert('请先填写 GitHub 访问令牌');return}
    setSyncStatus('创建云端备份…');
    fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':'token '+pat,'Content-Type':'application/json'},body:JSON.stringify({description:'寄售台账同步数据（勿删）',public:false,files:{'ledger.json':{content:JSON.stringify(S,null,1)}}})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(g){
      SYNC.pat=pat;SYNC.gist=g.id;SYNC.lastRemote=JSON.stringify(S,null,1);SYNC.dirty=false;
      try{localStorage.setItem('sync_pat',pat);localStorage.setItem('sync_gist',g.id)}catch(e){}
      var ge=document.getElementById('sync-gist');if(ge)ge.value=g.id;
      setSyncStatus('已创建，Gist ID：'+g.id);
      startWatch();
    })
    .catch(function(e){setSyncStatus('创建失败：'+e.message+'（检查令牌是否勾选 gist 权限）')});
  }
  else if(act==='syncsave'){
    var pat2=((document.getElementById('sync-pat')||{}).value||'').trim();
    var gist2=((document.getElementById('sync-gist')||{}).value||'').trim();
    SYNC.pat=pat2;SYNC.gist=gist2;
    try{localStorage.setItem('sync_pat',pat2);localStorage.setItem('sync_gist',gist2)}catch(e){}
    if(gist2){SYNC.dirty=true;pushSync();startWatch();setSyncStatus('已连接：'+gist2+'（每 5 秒自动同步）')}
    else setSyncStatus('未填写 Gist ID');
  }
  else if(act==='syncnow'){SYNC.dirty=true;pushSync();setTimeout(pullSync,1500)}
  else if(act==='syncoff'){
    if(SYNC.watchTimer){clearInterval(SYNC.watchTimer);SYNC.watchTimer=null}
    SYNC.pat='';SYNC.gist='';SYNC.dirty=false;
    try{localStorage.removeItem('sync_pat');localStorage.removeItem('sync_gist')}catch(e){}
    var pe=document.getElementById('sync-pat');if(pe)pe.value='';
    var ge2=document.getElementById('sync-gist');if(ge2)ge2.value='';
    setSyncStatus('已断开（数据仍保留在本机）');
  }
  else if(act==='wipe'&&confirm('确定清空全部数据（所有品类）？此操作不可恢复，建议先导出备份。')){
    addSnap('清空前自动备份');
    S={lines:[{id:'l1',name:'饰品'}],comps:[],photos:[],products:[],stores:[],shipments:[],sales:[],payments:[],settings:{lowStock:2,alertDays:30,wagePerHour:30}};LIN='l1';save();render();
  }
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('qv')){
    var f=el.dataset.f,pid=el.dataset.pid;
    var obj=f==='ship'?qo(QSHIP,SEL):qo(QSALE,SEL);
    var v=parseInt(el.value);
    if(isNaN(v)||v<0)v=0;
    if(f==='sale'){var left=shipped(SEL,pid)-sold(SEL,pid);if(v>left)v=left}
    obj[pid]=v;
  }
});
app.addEventListener('change',function(e){
  if(e.target.classList&&e.target.classList.contains('qv'))render();
});
app.addEventListener('submit',function(e){
  var f=e.target;if(!f.dataset.form)return;
  e.preventDefault();
  if(f.dataset.form==='product'){
    var code=document.getElementById('p-code').value.trim(),name=document.getElementById('p-name').value.trim();
    if(!code||!name)return;
    if(S.products.some(function(p){return p.code===code})){alert('货号已存在，请换一个');return}
    S.products.push({id:uid(),code:code,name:name,cat:document.getElementById('p-cat').value,
      price:parseFloat(document.getElementById('p-price').value)||0,
      line:LIN,diy:[],time:{base:0,asm:0},
      img:(document.getElementById('imgprev').dataset.img||'')});
    save();render();
  }else if(f.dataset.form==='store'){
    var nm=document.getElementById('st-name').value.trim();if(!nm)return;
    var rv=parseFloat(document.getElementById('st-ratio').value);
    S.stores.push({id:uid(),name:nm,city:document.getElementById('st-city').value.trim(),
      contact:document.getElementById('st-contact').value.trim(),
      mail:document.getElementById('st-mail').value.trim(),
      intro:document.getElementById('st-intro').value.trim(),
      status:'active',line:LIN,
      ratio:isNaN(rv)?0.6:Math.min(100,Math.max(0,rv))/100});
    save();render();
  }else if(f.dataset.form==='line'){
    var ln=document.getElementById('ln-name').value.trim();if(!ln)return;
    if(S.lines.some(function(l){return l.name===ln})){alert('品类已存在');return}
    var nid=uid();
    S.lines.push({id:nid,name:ln});
    LIN=nid;SEL=null;ORDER=null;MAPCITY=null;RECIPE=null;
    save();render();
  }else if(f.dataset.form==='comp'){
    var cn=document.getElementById('c-name').value.trim();if(!cn)return;
    var cc=parseFloat(document.getElementById('c-cost').value);
    if(isNaN(cc)){alert('请填写单价');return}
    S.comps.push({id:uid(),name:cn,unit:document.getElementById('c-unit').value,
      cost:cc,shape:document.getElementById('c-shape').value,img:COMPIMG});
    COMPIMG='';
    save();render();
  }else if(f.dataset.form==='pay'){
    var month=document.getElementById('pay-month').value;
    var amt=parseFloat(document.getElementById('pay-amt').value);
    if(!month||isNaN(amt)){alert('请填写账期月份和回款金额');return}
    var exist=paymentOf(SEL,month);
    if(exist&&!confirm('该店铺 '+monthLabel(month)+' 已有一笔回款记录（¥'+fmt(exist.amount)+'），要再记一笔吗？'))return;
    var statusEl=f.querySelector('input[name="pay-status"]:checked');
    S.payments.push({id:uid(),storeId:SEL,month:month,amount:amt,status:statusEl?statusEl.value:'unpaid',
      date:document.getElementById('pay-date').value||today(),note:document.getElementById('pay-note').value.trim()});
    save();render();
  }
});
function parseCSVLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(q){
      if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){out.push(cur);cur=''}
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}
function doCSVImport(){
  var f=this.files[0];if(!f)return;
  var dt=(document.getElementById('csv-date')||{}).value||today();
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var text=ev.target.result;
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      addSnap('导入CSV前自动备份');
      var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!==''});
      var mode='inv',storesN=0,prodsN=0,recN=0,payN=0,skipN=0;
      var statusMap={'已回款':'paid','已开发票未回款':'invoiced','未回款':'unpaid'};
      function lineBy(name){for(var i=0;i<S.lines.length;i++){if(S.lines[i].name===name)return S.lines[i]}var nl={id:uid(),name:name||'饰品'};S.lines.push(nl);return nl}
      function findStore(lid,name){for(var i=0;i<S.stores.length;i++){if(S.stores[i].line===lid&&S.stores[i].name===name)return S.stores[i]}return null}
      function findProd(lid,code){for(var i=0;i<S.products.length;i++){if(S.products[i].line===lid&&S.products[i].code===code)return S.products[i]}return null}
      lines.forEach(function(line,i){
        var cols=parseCSVLine(line);
        if(cols[0]==='品类'){
          if(cols.length>3&&cols[3]==='账期月份')mode='pay';
          return;
        }
        if(mode==='inv'){
          var ln=lineBy(cols[0]);
          var st=findStore(ln.id,cols[2]);
          if(!st){
            var ratio=parseFloat(cols[12])/100;if(isNaN(ratio))ratio=0.6;
            st={id:uid(),name:cols[2],line:ln.id,city:cols[3]||'',contact:'',mail:'',intro:'',ratio:ratio,status:cols[4]==='已停止合作'?'stopped':'active'};
            S.stores.push(st);storesN++;
          }
          var pr=findProd(ln.id,cols[5]);
          if(!pr){
            pr={id:uid(),code:cols[5],name:cols[6]||cols[5],cat:cols[7]||'其他',price:parseFloat(cols[11])||0,line:ln.id,diy:[],time:{base:0,asm:0},img:''};
            S.products.push(pr);prodsN++;
          }
          var sh=parseInt(cols[8])||0,so=parseInt(cols[9])||0;
          if(sh>0){S.shipments.push({id:uid(),storeId:st.id,productId:pr.id,qty:sh,date:dt,note:'期初导入'});recN++}
          if(so>0){S.sales.push({id:uid(),storeId:st.id,productId:pr.id,qty:so,date:dt,note:'期初导入'});recN++}
        }else{
          var ln2=lineBy(cols[0]);
          var st2=findStore(ln2.id,cols[2]);
          if(!st2)return;
          var month=cols[3];
          if(paymentOf(st2.id,month)){skipN++;return}
          S.payments.push({id:uid(),storeId:st2.id,month:month,amount:parseFloat(cols[4])||0,status:statusMap[cols[5]]||'unpaid',date:cols[6]||dt,note:cols[7]||''});
          payN++;
        }
      });
      save();
      alert('导入完成：新增店铺 '+storesN+' 家、货品 '+prodsN+' 款、期初记录 '+recN+' 条、回款 '+payN+' 笔'+(skipN?'（跳过重复回款 '+skipN+' 笔）':''));
      render();
    }catch(e){alert('CSV 解析失败：'+e.message)}
  };
  r.readAsText(f,'UTF-8');
}
function doImport(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!d.products||!d.stores||!d.shipments)throw 0;
      addSnap('导入JSON前自动备份');
      d.sales=d.sales||[];d.payments=d.payments||[];d.photos=d.photos||[];
      d.settings=d.settings||{lowStock:2,alertDays:30,wagePerHour:30};
      if(!d.lines||!d.lines.length)d.lines=[{id:'l1',name:'饰品'}];
      if(!d.comps||!d.comps.length)d.comps=[];
      d.stores.forEach(function(st){if(st.city==null)st.city='';if(st.intro==null)st.intro='';if(st.ratio==null)st.ratio=0.6;if(st.status==null)st.status='active';if(st.line==null)st.line='l1';if(st.mail==null)st.mail=''});
      d.products.forEach(function(p){
        if(p.line==null)p.line='l1';
        if(p.time==null)p.time={base:0,asm:0};
        if(p.diy==null){
          p.diy=[];
          if(p.recipe&&p.recipe.length){
            var col=0;
            p.recipe.forEach(function(it){
              var n=Math.min(24,Math.max(1,Math.round(+it.qty||1)));
              for(var k=0;k<n;k++){p.diy.push({cid:it.cid,x:60+(col%9)*56,y:80+Math.floor(col/9)*56});col++}
            });
          }
          delete p.recipe;
        }
      });
      S=d;LIN=S.lines[0].id;save();render();alert('导入成功');
    }catch(e){alert('文件格式不正确')}
  };
  r.readAsText(f);
}
render();
startWatch();
})();

.tab{color:#9aa2bb;letter-spacing:.06em}
.tab.on{color:#2f3d6e;border-bottom-color:#4a5f9e;font-weight:500}
/* 主按钮：藏青 */
.btn{
  background:linear-gradient(135deg,#33406e 0%,#232c48 100%) !important;
  color:#f2f5ff !important;
  border:1px solid #232c48 !important;
  border-radius:12px;
  box-shadow:0 5px 14px rgba(35,44,72,.28), inset 0 1px 0 rgba(255,255,255,.16) !important;
  transition:filter .2s var(--ease-out), transform .15s var(--ease-out);
}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
/* 关键动作：亮蓝渐变 */
.btn[data-act="shipgo"],.btn[data-act="salego"],.btn[data-act="rcsave"]{
  background:linear-gradient(135deg,#6d84c8 0%,#3d4f8e 100%) !important;
  color:#ffffff !important;
  border:1px solid rgba(61,79,142,.5) !important;
  box-shadow:0 5px 16px rgba(74,95,158,.35), inset 0 1px 0 rgba(255,255,255,.3) !important;
}
.btn[data-act="wipe"]{background:transparent !important;border-color:rgba(192,73,47,.5) !important;color:#c0492f !important;box-shadow:none !important}
/* 次按钮：白底细边 */
.btn.ghost{
  background:rgba(255,255,255,.72) !important;
  color:#2c3550 !important;
  border:1px solid #ccd4ea !important;
  box-shadow:0 2px 8px rgba(70,85,140,.07) !important;
}
.btn.ghost:hover{border-color:#4a5f9e !important;color:#2f3d6e !important}
.ibtn{background:rgba(255,255,255,.75);border:1px solid #ccd4ea;color:#8b93a8}
